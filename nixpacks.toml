[variables]
NIXPACKS_PHP_VERSION = '8.4'

[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --ignore-platform-reqs --no-scripts --no-interaction --optimize-autoloader',
  'npm ci --os=linux --cpu=x64 || npm install --include=optional'
]

[phases.build]
cmds = ['npm run build']